# Ambiente local de desenvolvimento — ver docs/adr/0005, 0011
# Produção usa Supabase Cloud (Postgres) + VPS (o resto). Isto é só para rodar na sua máquina.
name: spark-dev

services:
  postgres:
    image: supabase/postgres:15.8.1.040
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: spark_dev
      POSTGRES_DB: spark
    command:
      - postgres
      # a imagem supabase/postgres escuta só em 127.0.0.1/::1 por padrão —
      # certo dentro do stack completo deles (tudo atrás do Kong/Supavisor,
      # na mesma rede Docker), errado aqui: conexão publicada do host chega
      # pela interface do container, não por loopback, e o Postgres derruba
      # a conexão em silêncio (nem erro de auth — só fecha). O sintoma foi
      # "connection closed unexpectedly" e uma CLI (drizzle-kit) travada
      # pra sempre retentando. Sem isto, nada fora do container conecta.
      - -c
      - listen_addresses=*
      # replicação lógica ligada — requisito duro do Electric (ADR-0018)
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    volumes:
      - spark_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    command: valkey-server --appendonly yes
    volumes:
      - spark_valkey_data:/data

  # Electric dos TESTES: acompanha o Postgres local. O app usa o electric-app.
  electric:
    image: electricsql/electric:1.5.1
    restart: unless-stopped
    ports: ["3010:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:spark_dev@postgres:5432/spark?sslmode=disable
      ELECTRIC_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy

  # Electric do APP: sincroniza o banco real (Postgres do projeto Supabase —
  # docs/operacao/ambientes.md). Rede do host porque o endereço direto do
  # Supabase só tem IPv6 e a rede interna do Docker não o alcança.
  electric-app:
    image: electricsql/electric:1.5.1
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: ${ELECTRIC_DATABASE_URL:?defina ELECTRIC_DATABASE_URL no .env da raiz}
      ELECTRIC_PORT: "3011"
      ELECTRIC_DATABASE_USE_IPV6: "true"
      ELECTRIC_INSECURE: "true"
      ELECTRIC_USAGE_REPORTING: "false"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["8025:8025", "1025:1025"] # UI / SMTP — captura e-mail local, sem enviar de verdade

volumes:
  spark_pg_data:
  spark_valkey_data:
