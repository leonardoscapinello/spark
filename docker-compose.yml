# Serviços auxiliares locais. O Postgres é exclusivamente o Supabase de produção.
name: spark-dev

services:
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    command: valkey-server --appendonly yes
    volumes:
      - spark_valkey_data:/data

  # Electric do APP: sincroniza o banco real (Postgres do projeto Supabase —
  # docs/operacao/ambientes.md). Rede do host porque o endereço direto do
  # Supabase só tem IPv6 e a rede interna do Docker não o alcança.
  electric-app:
    image: electricsql/electric:1.5.1
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: ${ELECTRIC_DATABASE_URL:?defina ELECTRIC_DATABASE_URL no .env da raiz}
      ELECTRIC_PORT: "3011"
      ELECTRIC_DATABASE_USE_IPV6: "true"
      ELECTRIC_INSECURE: "true"
      ELECTRIC_USAGE_REPORTING: "false"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["8025:8025", "1025:1025"] # UI / SMTP — captura e-mail local, sem enviar de verdade

volumes:
  spark_valkey_data:
