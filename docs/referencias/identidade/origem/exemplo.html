<!doctype html>
<html lang="pt-BR" data-sumi-theme="papel">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sumi · exemplo fora do manual (CRM)</title>
<link rel="stylesheet" href="sumi.css">
<style>
  body{padding:40px 24px;display:flex;justify-content:center}
  .wrap{width:min(720px,100%);display:flex;flex-direction:column;gap:20px}
  .sheet{background:var(--sf) var(--grain);border:1px solid var(--bd);box-shadow:var(--sh1);border-radius:var(--r-xl);corner-shape:squircle;padding:28px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ink{height:36px;padding:0 16px;border:0;border-radius:999px;background:var(--ac);color:var(--acf);box-shadow:var(--ink);font:500 13px/1 var(--font);cursor:pointer;display:inline-flex;align-items:center}
  .leaf{height:36px;padding:0 16px;border:1px solid var(--bd);border-radius:999px;background:var(--sf3) var(--grain);box-shadow:var(--sh1);color:var(--tx);font:500 13px/1 var(--font);cursor:pointer;display:inline-flex;align-items:center}
  .seg{display:flex;padding:4px;gap:2px;border-radius:999px;background:var(--sf2);box-shadow:var(--deb);align-self:flex-start}
  .seg button{height:32px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--tx3);font:500 13px/1 var(--font);cursor:pointer}
  .seg button[data-on="true"]{color:var(--tx)}
  .seg [data-ind]{background:var(--sf3);box-shadow:var(--sh1);border-radius:999px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field span{font-size:12px;font-weight:500}
  .pill{height:40px;padding:0 16px;display:flex;align-items:center;border-radius:999px;background:var(--sf2);box-shadow:var(--deb)}
  .pill input{flex:1;border:0;background:transparent;outline:none;color:var(--tx);font:400 13px/1 var(--font)}
  .kpi{font:300 40px/1 var(--font);letter-spacing:-.045em}
  .muted{color:var(--tx2);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="row" style="justify-content:space-between">
    <h1 style="margin:0;font:500 28px/1.1 var(--font);letter-spacing:-.025em">Contato · Carla Prado</h1>
    <button class="leaf" data-press="sheet" onclick="toggleTheme(this)"><span data-lbl><span>Tema Carvão</span></span></button>
  </div>

  <div class="sheet" style="display:flex;flex-direction:column;gap:18px">
    <div class="seg" data-slide>
      <span data-ind></span>
      <button data-on="true" onclick="tab(this)">Visão geral</button>
      <button data-on="false" onclick="tab(this)">Negócios</button>
      <button data-on="false" onclick="tab(this)">Atividades</button>
    </div>
    <div class="row" style="gap:28px">
      <div><div class="muted">Valor em aberto</div><span class="kpi" data-odo="R$ 12.480" id="valor"></span></div>
      <button class="leaf" data-press="sheet" onclick="novo()"><span data-lbl><span>Simular novo negócio</span></span></button>
    </div>
  </div>

  <div class="sheet" data-morph id="form" style="display:flex;flex-direction:column;gap:14px">
    <label class="field"><span>E-mail</span><div class="pill"><input id="email" value="carla@studio" oninput="validar()"></div></label>
    <div data-collapse data-open="true" id="erro" style="--g:14px"><div><span style="font-size:12px;color:var(--er)">Inclua um domínio, ex.: carla@studio.com</span></div></div>
    <label class="field"><span>Senha do portal</span><div class="pill"><input type="password" placeholder="Crie uma senha"></div></label>
    <div class="row"><button class="ink" data-press="ink" id="salvar" onclick="salvar()"><span data-lbl><span>Salvar contato</span></span></button></div>
  </div>
</div>

<script src="sumi.js"></script>
<script>
  Sumi.init();
  function toggleTheme(b){const dark=document.documentElement.getAttribute('data-sumi-theme')!=='carvao';Sumi.setTheme(dark?'carvao':'papel');b.querySelector('[data-lbl] span').textContent=dark?'Tema Papel':'Tema Carvão';}
  function tab(b){b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('data-on',x===b));}
  let v=12480;function novo(){v+=Math.round(400+Math.random()*4000);document.getElementById('valor').setAttribute('data-odo','R$ '+v.toLocaleString('pt-BR'));}
  function validar(){const ok=/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(document.getElementById('email').value);document.getElementById('erro').setAttribute('data-open',!ok);}
  function salvar(){const b=document.querySelector('#salvar [data-lbl] span');b.textContent='Salvando…';setTimeout(()=>{document.getElementById('form').innerHTML='<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start"><span style="font:500 17px/1.3 var(--font)">Contato salvo</span><span class="muted">Carla Prado foi adicionada ao funil.</span></div>';},1200);}
</script>
</body>
</html>
