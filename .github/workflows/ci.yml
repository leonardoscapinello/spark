name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:spark_dev@localhost:5432/spark
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # turbo --filter=...[HEAD~1] precisa do commit anterior

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # docker-compose.yml, não o `services:` nativo do Actions — precisamos
      # do listen_addresses=* que já está no compose (ver docker-compose.yml:
      # a imagem supabase/postgres escuta só em loopback por padrão, e o
      # `services:` declarativo do Actions não tem como passar esse -c pro
      # processo postgres). Mesmo arquivo local e CI usam — zero deriva.
      - run: docker compose up -d postgres
      - name: Aguardar Postgres saudável
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' spark-dev-postgres-1 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Postgres não ficou saudável a tempo" >&2
          docker logs spark-dev-postgres-1
          exit 1

      # drizzle-kit migrate trava de forma reproduzível neste tipo de ambiente
      # (ver packages/db/scripts/migrate.mjs) — usamos o script próprio.
      - run: pnpm db:migrate

      # ADR-0024 — mesmo comando do dia a dia, mesmo orçamento de tempo (60s local;
      # aqui rodamos check:full porque é a esteira que protege a main.
      - run: pnpm check:full

      - run: pnpm size
